name: Lighthouse CI

on:
  push:
    branches: [main]
  pull_request:
    branches: ['*']

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      # npm install (not ci): see CLAUDE.md → Known gotchas, and the matching
      # comments in ci.yml / deploy.yml. Keep all three workflows consistent.
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      # A root-based build. The normal one sets base=/Pic-collage/ for GitHub
      # Pages, but LHCI's static server serves ./dist-lh at /, so index.html
      # would ask for /Pic-collage/assets/*.js and get 404s — no JS, no React,
      # no paint, and Lighthouse failed with NO_FCP without ever scoring the
      # app. Same bundle, served where it expects to be.
      - name: Build for Lighthouse
        run: npm run build:lh
      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: '.github/lighthouserc.json'
          uploadArtifacts: true
          temporaryPublicStorage: true
