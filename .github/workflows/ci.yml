name: CI

on:
  push:
    branches: ['*']
  pull_request:
    branches: ['*']

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      # npm install (not ci): npm's cross-version handling of optional platform
      # deps (@emnapi/* wasm fallbacks) can make a valid lockfile read as
      # "out of sync" under npm ci. See CLAUDE.md → Known gotchas.
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      # Gates only what ships to users; dev-tool advisories go through Dependabot
      # so a new one can't fail unrelated PRs.
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Lint (tsc + ESLint)
        run: npm run lint
      - name: Test (Vitest, coverage thresholds)
        run: npm run test:coverage
      - name: Install Playwright
        run: npx playwright install chromium --with-deps
      - name: E2E Tests
        run: npm run test:e2e
      # Visual baseline diffs (expected/actual/diff PNGs) for triage.
      - name: Upload e2e results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: test-results/
          retention-days: 7
      - name: Build
        run: npm run build -- --sourcemap hidden
      - name: Bundle budget
        run: npm run check:bundle
